function flyPt(lon,lat,w){const W=w,H=W*AR;flyTo({x:X(lon)-W/2,y:Y(lat)-H/2,w:W,h:H})}
// card as floating sheet
new MutationObserver(()=>$("cardw").classList.toggle("on",$("card").textContent.trim().length>0)).observe($("card"),{childList:true,subtree:true,characterData:true});

// search (oblasts, raions, cities)
const nz=s=>s.toLowerCase().replace(/[ʼ'’`]/g,"");
const SR=[];for(const k in paths)SR.push([fullName(k),"o",k]);RZ.forEach((r,i)=>SR.push([r[0],"r",i,r[1]]));CITIES.forEach(c=>SR.push([c[0],"c",c]));
$("sb").addEventListener("input",e=>{const q=nz(e.target.value.trim()),box=$("sr");if(!q){box.style.display="none";return}
  const hit=SR.filter(s=>nz(s[0]).includes(q)).sort((a,b)=>(nz(b[0]).startsWith(q)-nz(a[0]).startsWith(q))||(a[1]==="c"?-1:1)).slice(0,8);
  box.innerHTML=hit.map((s,i)=>`<button data-i="${SR.indexOf(s)}">${s[0]}<small>${s[1]==="o"?"область":s[1]==="r"?(s[3]||"район"):"місто"}</small></button>`).join("");box.style.display=hit.length?"block":"none"});

  if(s[1]==="o"){zoomTo(s[2]);pick(s[2])}else if(s[1]==="r"){const bb=rzEl[s[2]].getBBox(),W=Math.max(bb.width*2.2,bb.height*2.2/AR,B.w/200),H=W*AR;flyTo({x:bb.x+bb.width/2-W/2,y:bb.y+bb.height/2-H/2,w:W,h:H})}else flyPt(s[2][1],s[2][2],B.w/45)});

   +(neptunLive?`<h3>Районів у тривозі: ${raionAlert.size}</h3>`:"")+`<h3>Цілі на карті (${ids.length})</h3>`
   +(ids.map((id,i)=>{const t=markers.get(id).t,m=NEPTUN.getTypeMeta(t.type);return`<button class="it" data-m="${i}">${m.shortLabel||t.type}${t.region?" · "+t.region:t.title?" · "+t.title:""}</button>`}).join("")||"<div style='color:#7d8899;font-size:13px'>Немає</div>");

$("pc").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;$("pn").classList.remove("on");clearInterval(pnT);
  if(b.dataset.o){zoomTo(b.dataset.o);pick(b.dataset.o)}else follow($("pc")._ids[+b.dataset.m])});

$("shr").onclick=async()=>{const u=location.href;try{if(navigator.share)await navigator.share({title:document.title,url:u});else{await navigator.clipboard.writeText(u);toast("Посилання скопійовано")}}catch(_){}};
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}};
